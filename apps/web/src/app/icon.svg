       moldura quadrada — contra os 66% do app icon.
       ⚠️ Conferido rasterizando: a 32px os dois "S" borram e a 16px vira mancha. É o limite de
       5 letras dividindo 16 pixels, não do arquivo. Decisão do cliente, ciente disso.

       ⚠️ RAMPA INVERTIDA em relação ao portal do cliente (vesso-clientes), de propósito. Os
       dois favicons eram BYTE A BYTE idênticos e os dois apps ficam abertos lado a lado o dia
       inteiro — a aba do admin era indistinguível da do cliente. Como a palavra vira mancha a
       16px de qualquer jeito, o que separa as abas é a MASSA DE COR: aqui o tile é escuro, lá
